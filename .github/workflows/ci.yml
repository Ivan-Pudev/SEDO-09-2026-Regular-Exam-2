# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net


name: .NET CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore Homies.sln

      - name: Build application
        run: dotnet build Homies.sln --configuration Debug --no-restore

      - name: Run all tests
        run: dotnet test Homies.sln --configuration Debug --no-build --verbosity normal

      - name: Run unit and integration tests
        run: dotnet test Homies.sln --configuration Debug --no-build
